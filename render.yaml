services:
  - type: web
    name: ponponchan-emotional-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAT_MODEL
        value: qwen3:8b
      - key: EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_HOST
        sync: false
